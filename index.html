<!DOCTYPE html>
<html>
<head>
    <title>64-Bit Custom Birthday PC Emulator</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding: 50px; }
        #screen { width: 500px; height: 300px; background: #000; border: 4px solid #333; margin: 20px auto; padding: 20px; text-align: left; overflow-y: auto; box-shadow: 0 0 20px #0f0; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎁 BROTHER'S VIRTUAL 64-BIT GAMING RIG 🎁</h1>
    <p>Status: <span id="status">POWERED OFF</span></p>
    <button onclick="bootPC()">PRESS POWER BUTTON</button>
    
    <div id="screen">> System idle. Press power...</div>

    <script>
        function bootPC() {
            let screen = document.getElementById("screen");
            let status = document.getElementById("status");
            status.innerText = "RUNNING";
            status.style.color = "#0f0";
            
            let lines = [
                "🚀 Booting Virtual 64-Bit CPU Core...",
                "🧠 Register Bank initialized (32 slots, 64-bit wide)",
                "🔋 Power Supply: Stable 12V feed",
                "❄️ Thermals: Ice cold. No laptop lag here!",
                "💾 Loading Roblox-OS Kernel v1.0...",
                "🎉 LOADING COMPLETE! HAPPY BIRTHDAY! 🎉",
                "🎮 Initializing Bloxstrap 60 FPS Unlocker...",
                "❌ ERROR: Roblox graphic engine crashed! (Just kidding, open your real card for a real upgrade! 😉)"
            ];
            
            screen.innerHTML = "";
            let i = 0;
            function printLine() {
                if (i < lines.length) {
                    screen.innerHTML += lines[i] + "<br><br>";
                    screen.scrollTop = screen.scrollHeight;
                    i++;
                    setTimeout(printLine, 1200); // Prints a line every 1.2 seconds
                }
            }
            printLine();
        }
    </script>
</body>
</html>
